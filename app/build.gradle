plugins {
    id 'com.android.application'
}

android {
    namespace 'com.saoma.scanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.saoma.scanner"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "2.1"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // 中文版 / 英文版（独立包名，可同时安装）
    flavorDimensions "lang"
    productFlavors {
        zh {
            dimension "lang"
        }
        en {
            dimension "lang"
            applicationIdSuffix ".en"
            versionNameSuffix "-en"
        }
    }

    signingConfigs {
        release {
            // 签名信息不写进仓库：放在根目录 keystore.properties（已被 .gitignore 忽略）
            // 缺这个文件时仍能构建，只是 release 包不签名
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile rootProject.file(props.getProperty('storeFile', 'keystore/saoma.jks'))
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias', 'saoma')
                keyPassword props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*', 'DebugProbesKt.bin']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
